schema: 1
plugin: ArcBuilder
minecraft-version: '1.21.11'
minecraft-client-sha1: ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd
minecraft-asset-index-sha1: e9eeaade32639d73d4f7a30a007ace472c61cbd6
gallery-accent: '#d48763'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

custom-items:
  arc:background:
    material: GRAY_STAINED_GLASS_PANE
    model: assets/arc/models/gui/background.json
  arc:builder_book_draft:
    material: BOOK
    model: assets/arc/models/builder/book_draft.json
  arc:builder_book_active:
    material: BOOK
    model: assets/arc/models/builder/book_active.json

sources:
  builder:
    path: src/main/resources/modules/builder-tools.yml
    root: locales.ru
    prefix-key: prefix
    exclude:
      - prefix
  autobuild:
    path: src/main/resources/modules/auto-build.yml
    include:
      - build-book.display-name
      - build-book.lore
      - build-book.footer
      - build-book.states.*
      - build-book.price.*
      - build-book.player-materials.*
      - build-book.received
      - build-book.draft-preview-message
      - build-book.editor.*
      - cant-build-message
      - disabled-message
      - start-message
      - confirm-message
      - confirm-gui.*
      - start-build-message
      - already-building-message
      - building-gui.*
      - inactivity-cancel-message
      - messages.*
      - cancel-build-message
      - construction.npc-prompt

placeholders:
  amount: '384'
  balance: '842.50 <white>💰</white>'
  blocks: '1 248'
  building: 'Дом у северной гавани'
  cost: '64 камня, 32 дубовых доски'
  count: '1 248'
  creator: 'AlexeyBuilder'
  density: 'естественная'
  full_price: '1 920.00 <white>💰</white>'
  items: '96'
  kind: 'Вставка чертежа'
  labor: '240.00 <white>💰</white>'
  material: 'Дубовые доски ×32'
  materials: '1 680.00 <white>💰</white>'
  missing: '<#8c8c8c>   <#ff9f0f>Сейчас не хватает: <#d48763>Дубовые доски ×16'
  max: '2 000'
  missing_price: '640.00 <white>💰</white>'
  name: 'Дом у северной гавани'
  noise: 'мягкий'
  offset_x: '-5'
  offset_y: '2'
  offset_z: '12'
  price: '1 920.00 <white>💰</white>'
  owner: 'GrocerMC'
  percent: '67'
  progress: '67'
  purchased: '48'
  radius: '6'
  reason: 'limits.blocks-per-tick: значение должно быть от 1 до 256'
  required: '32× дубовых досок, 16× стекла'
  reward: '12 глубинного сланца'
  rotation: '90'
  seconds: '30'
  setting: 'Густота'
  shape: 'раскидистая'
  skipped: '3'
  state: 'черновик'
  status: 'готово'
  total: '1 920'
  types: '4'
  value: '-5'
  volume: '1 728'
  weight: '40%'
  x: '-1266'
  y: '85'
  z: '-506'

glyphs:
  - character: '🛠'
    path: '@ops/classic_survival/plugins/ItemsAdder/contents/arc/resourcepack/arc/textures/glyphs/builder_mark.png'
    height: 7
    ascent: 7
    advance: 8
  - character: '💰'
    path: '@ops/classic_survival/plugins/ItemsAdder/contents/arc/resourcepack/arc/textures/glyphs/coin.png'
    height: 9
    ascent: 8
    advance: 10

surfaces:
  hud:
    - id: book-draft-preview
      title: builder:book.preview.title
      subtitle: builder:book.preview.subtitle
      actionbar: builder:book.preview.actionbar
      bossbar: builder:book.preview.bossbar-draft
      bossbar-color: yellow
      bossbar-progress: 1.0
      placeholders:
        name: Дом у северной гавани
    - id: book-active-preview
      title: builder:book.preview.title
      subtitle: builder:book.preview.subtitle
      actionbar: builder:book.preview.actionbar
      bossbar: builder:book.preview.bossbar-active
      bossbar-color: green
      bossbar-progress: 1.0
      placeholders:
        name: Дом у северной гавани
    - id: book-plan-ready
      title: builder:book.plan-ready.title
      subtitle: builder:book.plan-ready.subtitle
      actionbar: builder:book.preview.actionbar
      bossbar: builder:book.preview.bossbar-active
      bossbar-color: green
      bossbar-progress: 1.0
      placeholders:
        name: Дом у северной гавани

  items:
    - id: selector-wand
      material: ECHO_SHARD
      name: builder:wand.name
      lore: builder:wand.lore
    - id: crown-brush
      material: BRUSH
      name: builder:crown-brush.name
      lore: builder:crown-brush.lore
    - id: draft-build-book
      material: BOOK
      itemsadder: arc:builder_book_draft
      name: autobuild:build-book.display-name
      lore:
        - autobuild:build-book.lore
        - autobuild:build-book.player-materials.draft
        - autobuild:build-book.footer
      placeholders:
        state: Бесплатный черновик
        price: после расчёта
    - id: active-build-book
      material: BOOK
      itemsadder: arc:builder_book_active
      name: autobuild:build-book.display-name
      lore:
        - autobuild:build-book.lore
        - autobuild:build-book.player-materials.heading
        - ref: autobuild:build-book.player-materials.row
          placeholders: {amount: '32', material: 'Дубовые доски'}
        - ref: autobuild:build-book.player-materials.row
          placeholders: {amount: '16', material: 'Стекло'}
        - autobuild:build-book.footer
      placeholders:
        state: Активная одноразовая книга
        price: '1 920.00 <white>💰</white>'
    - id: active-build-book-all-included
      material: BOOK
      itemsadder: arc:builder_book_active
      name: autobuild:build-book.display-name
      lore:
        - autobuild:build-book.lore
        - autobuild:build-book.player-materials.included
        - autobuild:build-book.footer
      placeholders:
        state: Активная одноразовая книга
        price: '1 920.00 <white>💰</white>'
    - id: delivery-pending-book
      material: BOOK
      itemsadder: arc:builder_book_active
      name: autobuild:build-book.display-name
      lore:
        - autobuild:build-book.lore
        - autobuild:build-book.player-materials.heading
        - ref: autobuild:build-book.player-materials.row
          placeholders: {amount: '32', material: 'Дубовые доски'}
        - ref: autobuild:build-book.player-materials.row
          placeholders: {amount: '16', material: 'Стекло'}
        - autobuild:build-book.footer
      placeholders:
        state: Подтверждается реестром
        price: '1 920.00 <white>💰</white>'
    - id: starter-build-book
      material: BOOK
      itemsadder: arc:builder_book_active
      name: autobuild:build-book.display-name
      lore:
        - autobuild:build-book.lore
        - autobuild:build-book.player-materials.included
        - autobuild:build-book.footer
      placeholders:
        name: Стартовый дом
        state: Готова к строительству
        price: не копируется
        creator: RusCrafting
        blocks: '1 248'

  inventories:
    - id: book-editor-default
      title: autobuild:build-book.editor.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      placeholders:
        name: Дом у северной гавани
        rotation: '90'
        offset_x: '-5'
        offset_y: '2'
        offset_z: '12'
      items:
        - slot: 4
          material: BOOK
          name: autobuild:build-book.editor.overview.name
          lore: autobuild:build-book.editor.overview.lore
        - slot: 11
          material: REDSTONE_TORCH
          name: autobuild:build-book.editor.axis-x.name
          lore: autobuild:build-book.editor.axis-x.lore
          placeholders: {value: '-5'}
        - slot: 13
          material: SCAFFOLDING
          name: autobuild:build-book.editor.axis-y.name
          lore: autobuild:build-book.editor.axis-y.lore
          placeholders: {value: '2'}
        - slot: 15
          material: RECOVERY_COMPASS
          name: autobuild:build-book.editor.axis-z.name
          lore: autobuild:build-book.editor.axis-z.lore
          placeholders: {value: '12'}
        - slot: 21
          material: CLOCK
          name: autobuild:build-book.editor.rotation.name
          lore: autobuild:build-book.editor.rotation.lore
          placeholders: {value: '90'}
        - slot: 23
          material: REPEATER
          name: autobuild:build-book.editor.reset.name
          lore: autobuild:build-book.editor.reset.lore
        - slot: 25
          material: WRITABLE_BOOK
          name: autobuild:build-book.editor.copy.name
          lore: autobuild:build-book.editor.copy.lore
          placeholders: {price: '1 920.00 <white>💰</white>'}
    - id: book-editor-preview-inactive
      extends: book-editor-default
      items:
        - slot: 11
          material: REDSTONE_TORCH
          name: autobuild:build-book.editor.preview-inactive.name
          lore: autobuild:build-book.editor.preview-inactive.lore
    - id: book-editor-book-mismatch
      extends: book-editor-default
      items:
        - slot: 13
          material: SCAFFOLDING
          name: autobuild:build-book.editor.preview-book-mismatch.name
          lore: autobuild:build-book.editor.preview-book-mismatch.lore
    - id: book-editor-protection-denied
      extends: book-editor-default
      items:
        - slot: 15
          material: RECOVERY_COMPASS
          name: autobuild:build-book.editor.preview-protection-denied.name
          lore: autobuild:build-book.editor.preview-protection-denied.lore
    - id: construction-control-active
      title: builder:construction.site.menu.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      placeholders:
        name: Дом у северной гавани
        owner: AlexeyBuilder
        state: строится
        count: '837'
        total: '1 248'
        percent: '67'
        x: '-1266'
        y: '85'
        z: '-506'
      items:
        - slot: 10
          material: BOOK
          name: builder:construction.site.menu.overview.name
          lore: builder:construction.site.menu.overview.lore
        - slot: 12
          material: CLOCK
          name: builder:construction.site.menu.progress.name
          lore: builder:construction.site.menu.progress.lore
        - slot: 14
          material: CHEST
          name: builder:construction.site.menu.resources.name
          lore:
            - builder:construction.site.menu.resources.lore
            - ref: builder:construction.site.menu.resources.line
              placeholders: {material: Дубовые доски, amount: '384'}
            - ref: builder:construction.site.menu.resources.line
              placeholders: {material: Камень, amount: '192'}
            - ref: builder:construction.site.menu.resources.line
              placeholders: {material: Стекло, amount: '48'}
        - slot: 16
          material: REDSTONE_TORCH
          name: builder:construction.site.menu.control.pause.name
          lore: builder:construction.site.menu.control.pause.lore
    - id: construction-control-paused
      extends: construction-control-active
      placeholders:
        state: на паузе
      items:
        - slot: 16
          material: LIME_DYE
          name: builder:construction.site.menu.control.resume.name
          lore: builder:construction.site.menu.control.resume.lore
    - id: construction-control-readonly
      extends: construction-control-active
      items:
        - slot: 16
          material: GRAY_DYE
          name: builder:construction.site.menu.control.readonly.name
          lore: builder:construction.site.menu.control.readonly.lore
    - id: construction-control-transition
      extends: construction-control-active
      placeholders:
        state: складывает блоки
      items:
        - slot: 16
          material: GRAY_DYE
          name: builder:construction.site.menu.control.unavailable.name
          lore: builder:construction.site.menu.control.unavailable.lore
    - id: build-confirmation
      title: autobuild:confirm-gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 11
          material: PAPER
          name: autobuild:confirm-gui.confirm.display
          lore: autobuild:confirm-gui.confirm.lore
        - slot: 15
          material: RED_STAINED_GLASS_PANE
          name: autobuild:confirm-gui.cancel.display
          lore: autobuild:confirm-gui.cancel.lore
    - id: building-progress
      title: autobuild:building-gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 4
          material: PAPER
          name: autobuild:building-gui.progress.display
          lore: autobuild:building-gui.progress.lore
          placeholders: {progress: '67'}
        - slot: 13
          material: RED_STAINED_GLASS_PANE
          name: autobuild:building-gui.cancel.display
          lore: autobuild:building-gui.cancel.lore
    - id: building-cancel-confirmation
      title: autobuild:building-gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 4
          material: PAPER
          name: autobuild:building-gui.progress.display
          lore: autobuild:building-gui.progress.lore
          placeholders: {progress: '67'}
        - slot: 13
          material: RED_STAINED_GLASS_PANE
          name: autobuild:building-gui.cancel-confirm.display
          lore: autobuild:building-gui.cancel-confirm.lore
    - id: building-admin
      title: autobuild:building-gui.title
      rows: 3
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 4
          material: PAPER
          name: autobuild:building-gui.progress.display
          lore: autobuild:building-gui.progress.lore
          placeholders: {progress: '67'}
        - slot: 13
          material: RED_STAINED_GLASS_PANE
          name: autobuild:building-gui.cancel.display
          lore: autobuild:building-gui.cancel.lore
        - slot: 22
          material: BLAZE_POWDER
          name: autobuild:building-gui.fast-finish.display
          lore: autobuild:building-gui.fast-finish.lore

  world:
    - id: builder-npc-confirmation
      text: autobuild:construction.npc-prompt
    - id: construction-site-panel
      text: builder:construction.site.panel

  fragments:
    - source: builder
      include:
        - crown.labels.*
        - book.quote-kind.*
        - book.state.*
        - operation.kind.*

  chat:
    - source: builder
      include: ['*']
    - source: autobuild
      include: ['*']
