      status:
        start: |-

          <prefix><#ff9f0f>Этап 1/7: сначала выделите будущую постройку.
          <#8c8c8c>   <click:run_command:'/builder wand'><#d48763>/builder wand</click> <#e6fff3>— селектор.
          <#8c8c8c>   <#e6fff3>ЛКМ и ПКМ — две точки.
        first-point: |-

          <prefix><#ff9f0f>Этап 1/7: первая точка выбрана.
          <#8c8c8c>   <#e6fff3>Координаты: <#d48763><x>, <y>, <z>
          <#8c8c8c>   <#e6fff3>Отметьте вторую точку <#d48763>ПКМ<#e6fff3>.
        second-point: |-

          <prefix><#ff9f0f>Этап 1/7: вторая точка выбрана.
          <#8c8c8c>   <#e6fff3>Координаты: <#d48763><x>, <y>, <z>
          <#8c8c8c>   <#e6fff3>Отметьте первую точку <#d48763>ЛКМ<#e6fff3>.
        selection: |-

          <prefix><#2bba43>Этап 2/7: область выделена.
          <#8c8c8c>   <#e6fff3>Размер: <#d48763><x> × <y> × <z> <#8c8c8c>— <#e6fff3><volume> блоков
          <#8c8c8c>   <click:run_command:'/builder copy'><#d48763>/builder copy</click> <#e6fff3>— сохранить чертёж.
