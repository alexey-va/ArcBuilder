          <prefix><#2bba43>Этап 3/7: чертёж готов — <#d48763><count> блоков.
          <#8c8c8c>   <#e6fff3>Возьмите обычную книгу.
          <#8c8c8c>   <click:suggest_command:'/builder book draft '><#d48763>/builder book draft [имя]</click> <#e6fff3>— создать черновик.
        draft: |-

          <prefix><#2bba43>Этап 4/7: бесплатный черновик готов.
          <#8c8c8c>   <#e6fff3>Название: <#d48763><name>
          <#8c8c8c>   <#e6fff3>ПКМ по блоку — поставить или перенести превью.
          <#8c8c8c>   <#e6fff3>ПКМ в воздух — рассчитать смету.
        draft-recovery: |-

          <prefix><#ff9f0f>Черновик сохранён и ожидает выдачи.
          <#8c8c8c>   <#e6fff3>Возьмите обычную книгу в основную руку.
          <#8c8c8c>   <click:run_command:'/builder book draft'><#d48763>/builder book draft</click> <#e6fff3>— продолжить с сохранённого шага.
        preview: |-

          <prefix><#2bba43>Этап 5/7: превью открыто.
          <#8c8c8c>   <#e6fff3>Контур обновляется постоянно.
          <#8c8c8c>   <#e6fff3>ПКМ по блоку — перенести; ПКМ в воздух — смета.
