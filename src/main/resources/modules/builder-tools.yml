        - "<#8c8c8c>   <click:run_command:'/builder crown place'><#d48763>/builder crown place</click> <#e6fff3>— построить вариант."
        - "<#8c8c8c>   <#969696>В выживании листва берётся из инвентаря."
        - "<#8c8c8c>   <#969696>В творческом режиме материалы не расходуются."
