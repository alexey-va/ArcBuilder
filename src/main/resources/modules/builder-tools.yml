# ARC Builder Tools. Runtime mirrors opt in explicitly; disabled elsewhere by default.
enabled: false
allowed-worlds: []
default-locale: ru

storage:
  # Runtime may point this to the existing shared catalogue during migration.
  schematics-root: schematics

limits:
  max-changes: 4096
  max-clipboard-blocks: 4096
  max-scan-volume: 8192
  absolute-max-axis: 48
  blocks-per-tick: 16
  base-hourly-changes: 20000
  maximum-range: 64

timers:
  plan-ttl: 30s
  clipboard-ttl: 15m
  undo-ttl: 30m
  journal-retention: 2h

construction:
  # Ordinary chests, trapped chests and barrels in this shell feed persistent projects.
  container-radius: 4
  # An online owner's inventory participates only while they remain near the site.
  online-inventory-range: 48
  tick-period-ticks: 1
  # Hard cap for container coordinates inspected by one project tick.
  max-container-probes-per-tick: 512
  # Per-project cache and per-call resolution caps keep dense storage areas bounded.
  max-cached-containers-per-project: 256
  max-resolved-containers-per-call: 32
  effects:
    # Cosmetic feedback is sampled by completed block number, so large builds stay quiet enough.
    enabled: true
    interval-blocks: 4
    sounds:
      enabled: true
      volume: 0.55
      pitch: 1.0
    particles:
      enabled: true
      count: 3
      spread: 0.2

runtime:
  # Refreshes the in-memory builder contribution; lifecycle health logging remains platform-owned.
  health-refresh-period-ticks: 20
  player-recovery-retry-period-ticks: 100
  progress-every-batches: 10

preview:
  # Refresh twice per second, matching the persistent feel of the old Denizen outline.
  period-ticks: 10
  radius: 32
  outline-spacing: 0.75
  max-selection-particles: 512
  # Small plans show every non-air block; large plans show this many blocks nearest to the moving player.
  max-plan-displays: 512
  # 1.0 renders every preview block at the exact size of a real Minecraft block.
  block-display-scale: 1.0
  plan-display-range: 64
  guidance-period-ticks: 20
  plan-title:
    fade-in-ticks: 5
    stay-ticks: 45
    fade-out-ticks: 10

# Read-only estimates and explicit procurement through EconomyShopGUI Premium.
# A normal /builder confirm never spends money.
shop:
  enabled: true
  max-quoted-materials: 64
  max-auto-buy-items: 4096
  max-auto-buy-price: '250000.00'

# Player-authored build books: free drafts, explicit priced activation and registered copies.
# Shop prices are read-only; the stored self-cost never rewrites EconomyShopGUI.
book-contracts:
  enabled: false
  construction-markup-percent: '15.00'
  max-issue-price: '50000000.00'
  auction-recovery-retry: 30s
  player-materials-summary-limit: 4
  mysql:
    enabled: false
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: minecraft
    password: ''
    ssl-mode: DISABLED
    fail-fast: false
    pool:
      minimum-idle: 0
      maximum-size: 4
      connection-timeout-ms: 5000
      socket-timeout-ms: 15000
      validation-timeout-ms: 3000
      max-lifetime-ms: 1700000

safety:
  require-lands: false
  require-coreprotect: true
  # Fill replaces only this expendable set; paste may also replace ordinary safe blocks.
  replaceable-materials:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - SHORT_GRASS
    - TALL_GRASS
    - FERN
    - LARGE_FERN
    - DEAD_BUSH
    - VINE
    - GLOW_LICHEN
    - SNOW
    # Build books may replace a water volume just like they replace air on land.
    - WATER
    - LAVA
    - BUBBLE_COLUMN
    - SEAGRASS
    - TALL_SEAGRASS
    - KELP
    - KELP_PLANT

