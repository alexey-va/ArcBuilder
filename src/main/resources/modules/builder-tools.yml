# ARC Builder Tools. Runtime mirrors opt in explicitly; disabled elsewhere by default.
enabled: false
allowed-worlds: []
default-locale: ru

storage:
  # Runtime may point this to the existing shared catalogue during migration.
  schematics-root: schematics

limits:
  max-changes: 4096
  max-clipboard-blocks: 4096
  max-scan-volume: 8192
  absolute-max-axis: 48
  blocks-per-tick: 16
  base-hourly-changes: 20000
  maximum-range: 64

timers:
  plan-ttl: 30s
  clipboard-ttl: 15m
  undo-ttl: 30m
  journal-retention: 2h

preview:
  # Refresh twice per second, matching the persistent feel of the old Denizen outline.
  period-ticks: 10
  radius: 32
  outline-spacing: 0.75
  max-selection-particles: 512
  max-plan-particles: 180

# Read-only estimates and explicit procurement through EconomyShopGUI Premium.
# A normal /builder confirm never spends money.
shop:
  enabled: true
  max-quoted-materials: 64
  max-auto-buy-items: 4096
  max-auto-buy-price: '250000.00'

# Player-authored build books: free drafts, explicit paid activation and paid copies.
# Shop prices are read-only; the stored self-cost never rewrites EconomyShopGUI.
book-contracts:
  enabled: false
  construction-markup-percent: '15.00'
  max-issue-price: '50000000.00'
  mysql:
    enabled: false
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: minecraft
    password: ''
    ssl-mode: DISABLED
    fail-fast: false
    pool:
      minimum-idle: 0
      maximum-size: 4
      connection-timeout-ms: 5000
      socket-timeout-ms: 15000
      validation-timeout-ms: 3000
      max-lifetime-ms: 1700000

safety:
  require-coreprotect: true
  # Fill replaces only this expendable set; paste may also replace ordinary safe blocks.
  replaceable-materials:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - SHORT_GRASS
    - TALL_GRASS
    - FERN
    - LARGE_FERN
    - DEAD_BUSH
    - VINE
    - GLOW_LICHEN
    - SNOW

locales:
  ru:
    prefix: "<#d48763>🛠 "
    help:
      - "<prefix><#e6fff3>Инструменты строителя"
      - "<#8c8c8c>   <#d48763>/builder wand <#e6fff3>— выделить область"
      - "<#8c8c8c>   <#d48763>/builder fill [блок] <#e6fff3>— заполнить пустоты"
      - "<#8c8c8c>   <#d48763>/builder copy <#e6fff3>и <#d48763>/builder paste <#e6fff3>— чертёж"
      - "<#8c8c8c>   <#d48763>/builder book draft [имя] <#e6fff3>— бесплатный черновик"
      - "<#8c8c8c>   <#e6fff3>Книгой: ПКМ по блоку — превью; в воздух — дальше"
      - "<#8c8c8c>   <#d48763>/builder book copy <#e6fff3>— платная копия"
      - "<#8c8c8c>   <#d48763>/builder book sell [цена] <#e6fff3>— продать книгу"
      - "<#8c8c8c>   <#d48763>/builder book <#e6fff3>— инструкция и этап"
      - "<#8c8c8c>   <#d48763>/builder clear <#e6fff3>— убрать выделение и его частицы"
      - "<#8c8c8c>   <#d48763>/builder deconstruct <#e6fff3>— разобрать область"
      - "<#8c8c8c>   <#d48763>/builder crown <#e6fff3>— создать крону"
      - "<#8c8c8c>   <#d48763>/builder confirm <#e6fff3>— применить показанный план"
      - "<#8c8c8c>   <#d48763>/builder confirm buy <#e6fff3>— докупить недостающее"
      - "<#8c8c8c>   <#d48763>/builder undo <#e6fff3>— подготовить отмену"
    errors:
      disabled: "<prefix><#ff9f0f>Строительные инструменты — только на survival."
      player-only: "<prefix><#c42323>Команда доступна только игрокам."
      no-permission: "<prefix><#c42323>У вас нет доступа к этому инструменту."
      game-mode: |-

        <prefix><#c42323>Режим недоступен для инструментов строителя.
        <#8c8c8c>   <#e6fff3>Нужен режим выживания или творчества.
      game-mode-changed: |-

        <prefix><#ff9f0f>Режим игры изменился после предпросмотра.
        <#8c8c8c>   <#e6fff3>Повторите план — расход зависит от режима.
      world-not-allowed: "<prefix><#ff9f0f>В этом мире инструменты строителя отключены."
      selection-missing: |-

        <prefix><#ff9f0f>Область ещё не выделена.
        <#8c8c8c>   <#e6fff3>Возьмите инструмент: <#d48763>/builder wand
      selection-too-large: "<prefix><#c42323>Область превышает ваш безопасный лимит."
      plan-failed: |-

        <prefix><#c42323>Не удалось подготовить безопасный план.
        <#8c8c8c>   <#969696>Ничего не изменено; попробуйте снова.
      empty-copy: |-

        <prefix><#ff9f0f>В выделении нет блоков для чертежа.
        <#8c8c8c>   <#e6fff3>Воздух и заменяемые растения не копируются.
      hourly-limit: |-

        <prefix><#ff9f0f>Достигнут безопасный лимит изменений за час.
        <#8c8c8c>   <#e6fff3>Подождите немного или уменьшите область.
      chunk-unloaded: |-

        <prefix><#ff9f0f>Часть области сейчас не загружена.
        <#8c8c8c>   <#e6fff3>Подойдите к постройке и повторите действие.
      too-far: |-

        <prefix><#ff9f0f>Область находится слишком далеко.
        <#8c8c8c>   <#e6fff3>Подойдите ближе и повторите действие.
      nothing-to-change: |-

        <prefix><#ff9f0f>Здесь нечего изменять.
        <#8c8c8c>   <#e6fff3>Проверьте выделение, материал и текущие блоки.
      busy: "<prefix><#ff9f0f>Другая операция здесь ещё не завершена."
      expired: |-

        <prefix><#ff9f0f>Предпросмотр устарел.
        <#8c8c8c>   <#e6fff3>Создайте план ещё раз; мир не изменён.
      inventory: |-

        <prefix><#c42323>Операцию пока нельзя выполнить.
        <#8c8c8c>   <#e6fff3>Проверьте материалы и свободное место.
        <#8c8c8c>   <#e6fff3>Убедитесь, что инструмент достаточно прочный.
      protection: |-

        <prefix><#c42323>Строительство здесь запрещено.
        <#8c8c8c>   На чужой территории нужны права Lands.
      material: |-

        <prefix><#c42323>Этот материал нельзя использовать.
        <#8c8c8c>   <#e6fff3>Для кроны выберите обычную листву.
      crown-setting: "<prefix><#c42323>Неверный параметр. <click:run_command:'/builder crown help'><#d48763>/builder crown help</click>"
      tool: |-

        <prefix><#c42323>Для демонтажа нужен подходящий инструмент.
        <#8c8c8c>   <#e6fff3>Держите его в основной руке.
        <#8c8c8c>   <#e6fff3>Прочности должно хватить на весь план.
      recovering: |-

        <prefix><#ff9f0f>Завершается безопасное восстановление.
        <#8c8c8c>   <#e6fff3>Попробуйте чуть позже.
      undo-missing: "<prefix><#ff9f0f>Нет завершённой операции для отката."
      shop-unavailable: |-

        <prefix><#ff9f0f>Админшоп сейчас недоступен.
        <#8c8c8c>   <#e6fff3>Принесите недостающие материалы.
      shop-not-supported: "<prefix><#ff9f0f>Докупка доступна только для fill, paste и crown."
      shop-material-unavailable: |-

        <prefix><#ff9f0f>Админшоп не продаёт часть материалов.
        <#8c8c8c>   <#e6fff3>Добавьте их вручную.
      shop-limit: |-

        <prefix><#c42323>Превышен лимит покупки.
        <#8c8c8c>   <#e6fff3><items> шт. <#8c8c8c>— <#e6fff3><price>
      shop-insufficient-funds: "<prefix><#ff9f0f>Нужно <#d48763><price> <#8c8c8c>— <#e6fff3>на балансе: <#d48763><balance>"
      shop-estimate-changed: "<prefix><#ff9f0f>Состав покупки изменился. Создайте план ещё раз."
      shop-purchase-failed: |-

        <prefix><#c42323>Материал не куплен.
        <#8c8c8c>   <#e6fff3><material>
      shop-purchase-ambiguous: |-

        <prefix><#c42323>Админшоп не подтвердил покупку.
        <#8c8c8c>   <#e6fff3>Материал: <#d48763><material>
        <#8c8c8c>   <#969696>Мир не изменён; выданные предметы уже у вас.
    selection:
      first: |-

        <prefix><#2bba43>Точка 1 <#8c8c8c>— <#d48763><x> <y> <z>
        <#8c8c8c>   ПКМ — выбрать точку 2
      second: |-

        <prefix><#2bba43>Точка 2 <#8c8c8c>— <#d48763><x> <y> <z>
        <#8c8c8c>   ЛКМ — выбрать точку 1
      complete: |-

        <#8c8c8c>   Область <#d48763><x>×<y>×<z> <#8c8c8c>— <#e6fff3><volume> блоков
        <#8c8c8c>   <click:run_command:'/builder copy'><#d48763>[Скопировать]</click> <#8c8c8c>— <click:run_command:'/builder clear'><#969696>[Сбросить]</click>
      cleared: |-

        <prefix><#969696>Выделение очищено; частицы скрыты.
        <#8c8c8c>   <#969696>Сохранённый чертёж не удалён.
      world-reset: |-

        <prefix><#ff9f0f>Точки из другого мира очищены.
        <#8c8c8c>   <#e6fff3>Выберите обе точки заново.
