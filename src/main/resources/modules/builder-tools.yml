        - "<#8c8c8c>      <#969696>Черновик — только предпросмотр; он не строит."
        - "<#8c8c8c>   5. <#e6fff3>ПКМ в воздух — получить смету без оплаты."
        - "<#8c8c8c>   6. <#e6fff3>Нажмите <#2bba43>[Оплатить]<#e6fff3> в сообщении со сметой."
        - "<#8c8c8c>   7. <click:run_command:'/builder book copy'><#d48763>/builder book copy</click> <#e6fff3>— копия по себестоимости."
        - "<#8c8c8c>      <click:suggest_command:'/builder book sell '><#d48763>/builder book sell [цена]</click> <#e6fff3>— продажа."
