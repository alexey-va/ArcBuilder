        - "<#e6fff3>ЛКМ по грани — показать крону."
        - "<#e6fff3>ПКМ — построить показанный вариант."
        - "<#969696>В выживании листва берётся из инвентаря."
        - "<#969696>В творческом режиме материалы не расходуются."
