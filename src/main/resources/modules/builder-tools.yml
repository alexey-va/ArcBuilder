          round: "округлая"
          wide: "раскидистая"
          tall: "вытянутая"
        density:
          airy: "воздушная"
          natural: "естественная"
          dense: "густая"
        noise:
          smooth: "мягкий"
          natural: "естественный"
          wild: "сильный"
      help:
        - "<prefix><#e6fff3><bold>Настройка кроны"
        - "<#8c8c8c>   <click:run_command:'/builder crown wand'><#d48763>/builder crown wand</click> <#e6fff3>— подготовить кисть."
        - "<#8c8c8c>   <click:suggest_command:'/builder crown palette oak_leaves,birch_leaves'><#d48763>/builder crown palette [листва]</click>"
