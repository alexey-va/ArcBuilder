name: ArcBuilder
version: '${version}'
main: ru.ruscrafting.builder.paper.ArcBuilderPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Survival-friendly builder tools and construction books
softdepend:
  - CoreProtect
  - Lands
  - Slimefun
  - ItemsAdder
  - EconomyShopGUI-Premium
  - zAuctionHouse
  - zAuctionHouseV3
  - Vault
  - RedisEconomy
  - WorldEdit
  - ARC
commands:
  builder:
    description: Survival-friendly builder tools
    usage: /builder [help|wand|fill|replace|disconnect|copy|book|paste|deconstruct|crown|confirm|cancel|undo|status|reload]
permissions:
  arcbuild.use:
    description: Use survival-friendly ArcBuilder tools
    default: false
    children:
      arcbuild.fill: true
      arcbuild.replace: true
      arcbuild.disconnect: true
      arcbuild.copy: true
      arcbuild.paste: true
      arcbuild.deconstruct: true
      arcbuild.crown: true
      arcbuild.book.create: true
  arcbuild.fill:
    default: false
  arcbuild.replace:
    default: false
  arcbuild.disconnect:
    default: false
  arcbuild.copy:
    default: false
  arcbuild.paste:
    default: false
  arcbuild.deconstruct:
    default: false
  arcbuild.deconstruct.without-tool:
    description: Allow ArcBuilder deconstruction without a suitable inventory tool
    default: false
  arcbuild.crown:
    default: false
  arcbuild.selection.size.20:
    default: false
  arcbuild.selection.size.40:
    default: false
  arcbuild.selection.size.60:
    default: false
  arcbuild.selection.size.80:
    default: false
  arcbuild.selection.size.100:
    default: false
  arcbuild.hourly.20000:
    default: false
  arcbuild.hourly.50000:
    default: false
  arcbuild.hourly.100000:
    default: false
  arcbuild.hourly.150000:
    default: false
  arcbuild.hourly.200000:
    default: false
  arcbuild.book.create:
    default: false
    children:
      arcbuild.book.edit: true
      arcbuild.book.sell: true
      arcbuild.book.use: true
  arcbuild.book.edit:
    default: false
  arcbuild.book.sell:
    default: false
  arcbuild.book.use:
    default: false
  arcbuild.book.cooldown.bypass:
    description: Bypass the durable build-book application cooldown
    default: op
  arcbuild.admin.reload:
    description: Validate and reload ArcBuilder configuration without restarting the server
    default: op
  arcbuild.admin.construction:
    description: Control construction projects owned by other players
    default: op
  arcbuild.admin.preview:
    description: View and inspect build previews owned by other players
    default: op
  arcbuild.admin.systembook:
    description: Issue reviewed system construction books
    default: op
