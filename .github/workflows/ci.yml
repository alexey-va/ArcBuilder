name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arcbuilder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify arc-core consumer architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@591352f85a4dfc4ef06815a6439d2f2979c5f638
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Unit tests and production JAR
        run: ./gradlew --no-daemon test shadowJar
      - name: Verify production artifact
        run: |
          jar_path="build/libs/ArcBuilder-1.0.0.jar"
          test -s "$jar_path"
          jar tf "$jar_path" | grep -Fx plugin.yml
          jar tf "$jar_path" | grep -Fq 'kotlin/collections/CollectionsKt.class'
          ! jar tf "$jar_path" | grep -Eq '^(org/bukkit|io/papermc|com/sk89q)/'
          unzip -p "$jar_path" plugin.yml | grep -Fx 'name: ArcBuilder'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ArcBuilder-${{ github.sha }}
          path: build/libs/ArcBuilder-1.0.0.jar
          if-no-files-found: error

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify arc-core consumer architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@591352f85a4dfc4ef06815a6439d2f2979c5f638
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: MySQL migrations, contention, recovery, and anti-duplication
        run: ./gradlew --no-daemon integrationTest
