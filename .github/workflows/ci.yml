name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.codex/**', 'src/test/e2e/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.codex/**', 'src/test/e2e/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcbuilder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify arc-core consumer architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@7606a5039876f3f949657655e5364f41593aa8dd
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Unit tests and production JAR
        run: ./gradlew --no-daemon --build-cache test shadowJar
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArcBuilder-unit-reports-${{ github.sha }}
          retention-days: 7
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
      - name: Verify production artifact
        id: artifact
        run: |
          shopt -s nullglob
          candidates=(build/libs/ArcBuilder-*.jar)
          jar_paths=()
          for candidate in "${candidates[@]}"; do
            [[ "$candidate" == *-plain.jar ]] || jar_paths+=("$candidate")
          done
          test "${#jar_paths[@]}" -eq 1
          jar_path="${jar_paths[0]}"
          test -s "$jar_path"
          jar tf "$jar_path" > build/production-jar.entries
          grep -Fx plugin.yml build/production-jar.entries
          grep -Fq 'kotlin/collections/CollectionsKt.class' build/production-jar.entries
          ! grep -Eq '^(org/bukkit|io/papermc|com/sk89q|ru/arc/paper/api|ru/arc/paper/schematics)/' build/production-jar.entries
          ! grep -Eq '^ru/arc/paper/runtime/PaperNativeCleanupServiceProvider' build/production-jar.entries
          unzip -p "$jar_path" plugin.yml | grep -Fx 'name: ArcBuilder'
          printf 'path=%s\n' "$jar_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArcBuilder-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify arc-core consumer architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@7606a5039876f3f949657655e5364f41593aa8dd
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: MySQL migrations, contention, recovery, and anti-duplication
        run: ./gradlew --no-daemon integrationTest
      - name: Preserve MySQL integration test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArcBuilder-mysql-integration-${{ github.sha }}
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_TIMEOUT: "60000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check out ARC runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: alexey-va/ARC
          ref: 75724dab83674e5a410fa0bac3ba21cfb117f64f # ARC 1.4.409 baseline; standalone ArcCore 0.1.12 is pinned in build.gradle.kts
          path: e2e-arc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build ARC runtime
        working-directory: e2e-arc
        run: ./gradlew --no-daemon shadowJar
      - name: Test ArcBuilder on real Paper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          mapfile -t arc_jars < <(find "$GITHUB_WORKSPACE/e2e-arc/build/libs" -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' -print | sort)
          test "${#arc_jars[@]}" -eq 1
          ./gradlew --no-daemon prepareE2eRuntimeArtifacts "-Pe2eArcJar=${arc_jars[0]}"
          ./gradlew --no-daemon plugwrightTest "-Pe2eArcJar=${arc_jars[0]}" 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Upload E2E results and Paper logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc-builder-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/e2e-runtime/runtime-artifacts.properties
            build/plugwright/logs/
            build/plugwright/crash-reports/
